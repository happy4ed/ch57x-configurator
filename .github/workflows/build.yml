name: build-windows-app

# 코드가 push 되면 윈도우에서 자동 빌드 → 단독 실행파일(.exe) 생성.
#  · master push  → Actions 의 Artifacts 에 올린다(로그인 필요 · 90일 뒤 만료).
#  · v* 태그 push → ★GitHub Release 를 만들고 zip 을 붙인다(로그인 없이 받는 상설 주소).
#    Artifacts 만 있으면 사용자가 최신 빌드를 받을 방법이 사실상 없다(2026-09-13).
#  · 수동 실행(workflow_dispatch) — 브랜치에서도 돈다: gh workflow run build.yml --ref <브랜치>
#  · 0.3.0: Core 단위 시험(windows/Ch57x.Tests) + 화면 렌더 확인(--render-screens) → PNG 를 Artifacts 「render-png」로.
#  · 0.3.1: 권한 질문 파이프 왕복(--pipe-test + node) · 첫 인스턴스 시험 → 기록을 Artifacts 「pipe-test」로.
on:
  push:
    branches: [ master ]
    paths: [ 'windows/**', '.github/workflows/build.yml' ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write        # 릴리스 생성에 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ──────── Core 단위 시험 (업로드 보존 · 가져오기 · 실행 취소 · 상용구 · 용어)
      - name: Core tests
        run: dotnet test windows/Ch57x.Tests/Ch57x.Tests.csproj -c Release --logger "console;verbosity=normal"

      # ──────── Slim: framework-dependent (~5MB).
      # 실행하려면 PC 에 .NET 8 Desktop Runtime 필요(없으면 윈도우가 자동 다운로드 안내).
      - name: Publish slim (framework-dependent)
        run: >
          dotnet publish windows/Ch57x.App/Ch57x.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish-slim

      - name: Upload slim
        uses: actions/upload-artifact@v4
        with:
          name: CH57x-설정기-slim-win-x64
          path: publish-slim/*.exe
          if-no-files-found: error

      # ──────── Portable: self-contained (~30MB) — 런타임 설치 필요 없음, 어디서나 실행.
      # WPF self-contained 는 약 60MB 가 한계 (런타임+WPF 어셈블리). 트림은 WPF 호환성 깨짐.
      - name: Publish portable (self-contained)
        run: >
          dotnet publish windows/Ch57x.App/Ch57x.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=false
          -p:DebugType=None -p:DebugSymbols=false
          -o publish-portable

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: CH57x-설정기-portable-win-x64
          path: publish-portable/*.exe
          if-no-files-found: error

      # ──────── 화면 렌더 확인 (장치 · 설정 파일 · 자동실행을 건드리지 않음) — 창마다 라이트 · 다크 PNG (125%)
      - name: Render screens
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish-portable -Filter *.exe | Select-Object -First 1
          $out = Join-Path $PWD 'render'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--render-screens', "`"$out`"" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Write-Host '시간 초과 — 렌더 프로세스를 멈춤'; $code = 124 } else { $code = $p.ExitCode }
          Write-Host "종료 코드: $code"
          if (Test-Path "$out/render.log") { Get-Content "$out/render.log" }
          Get-ChildItem $out | Format-Table Name, Length
          if ($code -ne 0) { exit 1 }

      - name: Upload render PNG
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: render-png
          path: render/
          if-no-files-found: warn

      # ──────── 0.3.1 권한 질문 파이프 왕복 — 앱을 --pipe-test 로 띄우고(진짜 파이프 서버 · 팝업 · RegisterHotKey),
      # node 로 에이전트 패드 확장 pcPipe.ts 와 같은 방식(net.connect · 줄 JSON)으로 붙어 각본 17가지를 본다(0.3.1 마무리: 닫기 단추 = none 추가).
      - name: Pad pipe round trip
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          node --version
          $exe = Get-ChildItem publish-portable -Filter *.exe | Select-Object -First 1
          $out = Join-Path $PWD 'pipe-test'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log = Join-Path $out 'pipe-test.log'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--pipe-test', "`"$out`"" -PassThru
          $null = $p.Handle
          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern '준비됨' -Quiet)) { $ready = $true; break }
            if ($p.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) {
            Write-Host '앱이 준비되지 않음'
            if (Test-Path $log) { Get-Content $log }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            exit 1
          }
          Push-Location $out
          node "$env:GITHUB_WORKSPACE/windows/tools/pad-pipe-roundtrip.js" run "$log"
          $nodeCode = $LASTEXITCODE
          Pop-Location
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; Write-Host '앱이 끝나지 않음 — PID 로 멈춤'; $appCode = 124 } else { $appCode = $p.ExitCode }
          Write-Host "node 종료 코드 $nodeCode · 앱 종료 코드 $appCode"
          Write-Host '──── pipe-test.log'
          Get-Content $log
          if ($nodeCode -ne 0 -or $appCode -ne 0) { exit 1 }

      # 같은 이름 파이프를 다른 프로그램(node)이 먼저 열었으면 앱은 받지 않아야 한다(FirstPipeInstance) — 종료 코드 3
      - name: Pad pipe first instance
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish-portable -Filter *.exe | Select-Object -First 1
          $out = Join-Path $PWD 'pipe-test-squat'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $ready = Join-Path $out 'squat.ready'
          $n = Start-Process -FilePath node -ArgumentList "`"$env:GITHUB_WORKSPACE/windows/tools/pad-pipe-roundtrip.js`"", 'squat', '30000', "`"$ready`"" -PassThru -NoNewWindow
          for ($i = 0; $i -lt 60 -and -not (Test-Path $ready); $i++) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $ready)) { Write-Host 'node 가 파이프를 먼저 열지 못함'; if (-not $n.HasExited) { Stop-Process -Id $n.Id -Force }; exit 1 }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--pipe-test', "`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; $code = 124 } else { $code = $p.ExitCode }
          Write-Host "앱 종료 코드 $code (기대 3 = 이름 선점됨 · 받지 않음)"
          Get-Content (Join-Path $out 'pipe-test.log')
          if (-not $n.HasExited) { Stop-Process -Id $n.Id -Force }
          if ($code -ne 3) { exit 1 }

      - name: Upload pipe test logs
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: pipe-test
          path: |
            pipe-test/
            pipe-test-squat/
          if-no-files-found: warn

      # ──────── 태그(v*)일 때만: 로그인 없이 받을 수 있는 Release 를 만든다.
      # 자산은 zip 으로 묶는다. 사용자는 ★압축을 풀고 실행해야 한다 —
      # zip 을 탐색기에서 열어 안의 exe 를 바로 실행하면 실행 위치가 임시 폴더라
      # 자동시작 등록이 재부팅에 사라진다(앱이 감지해 안정 위치로 복사하지만, 안내를 릴리스 본문에 적는다).
      - name: Package release zips
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # 자산 이름은 ASCII 로 둔다 — 한글이 들어가면 러너에서 인코딩이 깨져 "CH57x-.-portable" 이 된다(실측).
          Compress-Archive -Path publish-portable/*.exe -DestinationPath "release/CH57x-Configurator-portable-win-x64.zip" -Force
          Compress-Archive -Path publish-slim/*.exe     -DestinationPath "release/CH57x-Configurator-slim-win-x64.zip"     -Force
          Get-ChildItem release | Format-Table Name,Length

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## 받는 법

          | 파일 | 언제 쓰나 |
          |---|---|
          | ``CH57x-Configurator-portable-win-x64.zip`` | 대부분 이것. .NET 설치가 필요 없다(약 60MB). |
          | ``CH57x-Configurator-slim-win-x64.zip`` | .NET 8 Desktop Runtime 이 이미 있는 PC (약 5MB). |

          ### 설치
          0. 받은 zip 을 **우클릭 → 속성 → 아래쪽 「차단 해제」 체크 → 확인**.
             인터넷에서 받은 파일에는 출처 표식이 붙어 **실행할 때마다** 보안 경고가 뜬다.
             (코드 서명이 없어서가 아니라 이 표식 때문이며, 차단 해제로 없어진다.)
          1. zip 을 **압축 푼다**(탐색기에서 zip 을 열어 안의 exe 를 바로 실행하지 말 것 —
             실행 위치가 임시 폴더라 재부팅에 사라진다).
          2. 푼 폴더의 ``CH57x 설정기.exe`` 실행 → 트레이(우측 하단)에 아이콘이 뜬다.
          3. 트레이 우클릭 → **윈도우 시작 시 자동실행** 체크.
             다운로드·임시 폴더에서 실행 중이면 앱이 ``%LOCALAPPDATA%\Programs\Ch57x\`` 로
             자기를 복사한 뒤 그 사본을 등록한다(그 사실을 알림으로 표시).

          자동실행 상태는 트레이 메뉴에 그대로 보이고, 등록이 깨졌으면 **눌러서 고치기** 항목이 나온다.

          ### 웹 버전 (설치 없이)
          <https://happy4ed.github.io/ch57x-configurator/>
          "@
          gh release create $tag (Get-ChildItem release/*.zip | ForEach-Object { $_.FullName }) `
            --title "CH57x 설정기 $tag" --notes $notes
